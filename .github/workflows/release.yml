name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    environment: release
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prime Gradle wrapper distribution
        run: |
          distribution_url=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2-)
          distribution_url="${distribution_url//\\:/\:}"
          distribution_file=$(basename "$distribution_url")
          distribution_name="${distribution_file%.zip}"
          distribution_hash="5xuhj0ry160q40clulazy9h7d"
          distribution_dir="$HOME/.gradle/wrapper/dists/$distribution_name/$distribution_hash"

          if [ ! -d "$distribution_dir/gradle-8.13" ]; then
            mkdir -p "$distribution_dir"
            curl --fail --location --retry 5 --retry-all-errors \
              --connect-timeout 60 --max-time 300 \
              "$distribution_url" \
              --output "$RUNNER_TEMP/$distribution_file"
            unzip -q "$RUNNER_TEMP/$distribution_file" -d "$distribution_dir"
          fi

      - name: Decode release signing key
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is required for release signing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/signing/release.jks
        run: |
          ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signed APK
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::Signed release APK was not produced"
            find app/build/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi

          APK="$apk" scripts/verify_apk.sh
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"

          tag_name="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag }}"
          fi

          mkdir -p dist
          release_apk="dist/pixel-proxy-gateway-${tag_name}.apk"
          cp "$apk" "$release_apk"
          sha256sum "$release_apk" > "${release_apk}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-proxy-gateway-release
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag }}"
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" dist/* --clobber
          else
            gh release create "$tag_name" dist/* \
              --title "Pixel Proxy Gateway ${tag_name}" \
              --generate-notes \
              --verify-tag
          fi
